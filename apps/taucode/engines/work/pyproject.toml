[project]
name = "taucode-work"
version = "0.1.0"
description = "taucode Work mode document skills runtime (docx, xlsx, pptx, pdf, charts); local only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "python-docx",
  "openpyxl",
  "python-pptx",
  "pypdf",
  "reportlab",
  "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
exclude-newer = "2026-10-09T00:00:00Z"
