[package]
name = "tau-mcp-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3", features = ["server", "client", "transport-io", "transport-child-process", "macros"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
