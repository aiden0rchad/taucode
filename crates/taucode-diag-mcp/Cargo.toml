[package]
name = "taucode-diag-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "3", features = ["server", "client", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
